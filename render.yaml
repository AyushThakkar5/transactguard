# Render Blueprint — two services from one repository.
#
# Import this from the Render dashboard (New → Blueprint) and point it at the
# GitHub repo. Every value below is safe to commit; secrets are declared with
# `sync: false`, which tells Render to prompt for them rather than read them
# from here.
#
# The two services:
#   transactguard-api  the Express gateway the browser talks to, which on this
#                      plan also hosts the BullMQ consumer in-process
#   transactguard-ml   the FastAPI scorer, reached only server-to-server
#
# WHY THE WORKER IS NOT A THIRD SERVICE
# Architecturally it should be: scoring 20,000 rows should not compete with
# request handling for the same event loop. Render's free plan has no
# Background Worker type, so RUN_WORKER_INLINE=true starts the same BullMQ
# consumer inside the API process instead, at concurrency 2 rather than 5 to
# leave headroom for requests. Nothing about the queue changes — jobs are still
# enqueued over Redis and progress still travels back over Redis pub/sub, so
# moving the worker back out is a config change, not a rewrite. Locally it is
# still its own process via `npm run worker`; inline mode is opt-in.
#
# Postgres and Redis are NOT declared here: the free tiers of Supabase and
# Upstash outlast Render's, and both are supplied as connection strings.

services:
  # ---------------------------------------------------------------- API -----
  - type: web
    name: transactguard-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; server.js reads it through config/env.js.
      - key: RUN_WORKER_INLINE     # no Background Worker service type on the free plan —
        value: 'true'              # server.js starts the BullMQ consumer after app.listen()
      - key: DATABASE_URL          # Supabase → Settings → Database → Connection string (URI)
        sync: false
      - key: REDIS_URL             # Upstash → Database → Redis Connect → rediss://…
        sync: false
      - key: JWT_SECRET            # node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
        sync: false
      - key: JWT_REFRESH_SECRET    # must differ from JWT_SECRET — the app refuses to start otherwise
        sync: false
      - key: ML_SERVICE_API_KEY    # must equal INTERNAL_API_KEY on transactguard-ml
        sync: false
      - key: ADMIN_SEED_PASSWORD   # required by the seed when NODE_ENV=production
        sync: false
      - key: ANALYST_SEED_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN        # e.g. https://transactguard.vercel.app — the API refuses
        sync: false                # to start in production without it
      - key: ML_SERVICE_URL
        fromService:
          name: transactguard-ml
          type: web
          property: hostport

  # --------------------------------------------------------- ML SERVICE -----
  - type: web
    name: transactguard-ml
    runtime: python
    plan: free
    region: oregon
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render; binding 0.0.0.0 is required for its proxy to
    # reach the process.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    # No healthCheckPath: /health requires the internal API key, and Render's
    # prober cannot send a header. Render falls back to a TCP port check.
    envVars:
      - key: ENV
        value: production
      - key: INTERNAL_API_KEY      # must equal ML_SERVICE_API_KEY on the API
        sync: false
